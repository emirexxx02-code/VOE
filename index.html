<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#dde5ee; --accent:#0b7a75; --accent-soft:#e3f4f2;
    --blue:#2563eb; --blue-soft:#e6edfd; --amber:#b45309; --amber-soft:#fdf1de;
    --red:#b91c1c; --red-soft:#fdeaea; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.2px}
  button{font-family:inherit;font-size:14px;cursor:pointer;border:0;border-radius:10px;transition:.15s}
  input,select,textarea{
    font-family:inherit;font-size:15px;width:100%;padding:11px 12px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,122,117,.12)}
  textarea{resize:vertical;min-height:66px}
  label.fld{display:block;margin-bottom:12px}
  label.fld > span{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.03)}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 100px}
  .wrap.wide{max-width:1120px}
  .topbar{
    position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:1120px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
  .brand .dot{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
  .brand b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;font-weight:600;background:#f1f5f9;color:var(--ink);border:1px solid var(--line);min-height:40px}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff}
  .btn.ghost{background:#fff}
  .btn.sm{padding:6px 11px;font-size:12.5px;min-height:34px}
  .btn.block{width:100%}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#f1f5f9;color:var(--muted);white-space:nowrap}
  .pill.ok{background:var(--accent-soft);color:var(--accent)}
  .pill.tax{background:var(--amber-soft);color:var(--amber)}
  .pill.blue{background:var(--blue-soft);color:var(--blue)}
  .pill.red{background:var(--red-soft);color:var(--red)}
  .tabs{display:flex;gap:6px;background:#e2e8f0;padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
  .tab{flex:1;padding:9px 12px;font-size:13px;font-weight:700;color:var(--muted);background:transparent;border-radius:9px;white-space:nowrap;text-align:center}
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .hero{padding:24px 4px 10px}
  .hero h1{font-size:22px}
  .hero p{color:var(--muted);font-size:14px;margin:6px 0 0}
  .sec-title{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:18px 0 8px}
  .weather-banner{
